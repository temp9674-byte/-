<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Web Watcher - サイト更新監視ツール</title>
  
  <!-- 簡易パスワード保護スクリプト -->
  <script>
    (function() {
      const SECRET_PASSWORD = "my-secret-pass";
      const savedAuth = sessionStorage.getItem('app_authenticated');
      if (savedAuth !== 'true') {
        const input = prompt("アクセスパスワードを入力してください:");
        if (input === SECRET_PASSWORD) {
          sessionStorage.setItem('app_authenticated', 'true');
        } else {
          alert("パスワードが正しくありません。");
          document.write("<h2 style='text-align:center; padding-top:50px; color:#ef4444; font-family:sans-serif;'>アクセス権限がありません</h2>");
          window.stop();
        }
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- ヘッダー -->
    <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-eye text-indigo-600"></i> Web Watcher
        </h1>
        <p class="text-xs text-slate-500 mt-1">Webサイト更新自動監視ツール</p>
      </div>
      <button id="settingsBtn" class="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-700 transition font-medium flex items-center gap-2">
        <i class="fa-solid fa-gear"></i> API設定
      </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="space-y-6">
      <!-- 監視サイト追加フォーム -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">新規監視サイトの追加</h2>
        <form id="addSiteForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">サイト名</label>
            <input type="text" id="siteName" required placeholder="例: 公式お知らせページ" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">対象URL</label>
            <input type="url" id="siteUrl" required placeholder="https://example.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">監視の観点・指示 (Geminiへの指示)</label>
            <textarea id="sitePrompt" rows="2" required placeholder="例: 新着ニュースやイベント情報の更新があったかチェックしてください。" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">チェック間隔</label>
            <select id="checkInterval" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
              <option value="1">毎日（1日ごと）</option>
              <option value="2">2日ごと</option>
              <option value="3">3日ごと</option>
              <option value="7">毎週（7日ごと）</option>
            </select>
          </div>
          <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">
            監視リストに追加
          </button>
        </form>
      </section>

      <!-- 監視制御パネル -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <button id="checkNowBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg text-sm transition flex items-center gap-2">
            <i class="fa-solid fa-rotate"></i> 今すぐ一括手動チェック
          </button>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-600">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          自動監視稼働中（設定された間隔でチェック）
        </div>
      </section>

      <!-- 監視サイト一覧 -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">登録済みサイト一覧</h2>
        <div id="siteList" class="space-y-4">
          <p id="emptyState" class="text-sm text-slate-400 text-center py-8">登録済みのサイトはありません。</p>
        </div>
      </section>
    </main>
  </div>

  <!-- API設定モーダル -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <h3 class="text-lg font-bold text-slate-900">API・通知キー設定</h3>
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Gemini API Key</label>
        <input type="password" id="geminiApiKey" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">EmailJS Service ID</label>
        <input type="text" id="emailjsServiceId" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">EmailJS Template ID</label>
        <input type="text" id="emailjsTemplateId" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">EmailJS Public Key</label>
        <input type="text" id="emailjsPublicKey" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">通知先メールアドレス</label>
        <input type="email" id="targetEmail" class="w-full px-3 py-2 border rounded-lg text-sm">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="closeModalBtn" class="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">キャンセル</button>
        <button id="saveSettingsBtn" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">保存</button>
      </div>
    </div>
  </div>

  <!-- メインJS処理 -->
  <script>
    const STORAGE_KEY_SITES = 'web_watcher_sites';
    const STORAGE_KEY_CONFIG = 'web_watcher_config';

    let sites = JSON.parse(localStorage.getItem(STORAGE_KEY_SITES) || '[]');
    let config = JSON.parse(localStorage.getItem(STORAGE_KEY_CONFIG) || '{}');

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const addSiteForm = document.getElementById('addSiteForm');
    const siteList = document.getElementById('siteList');
    const emptyState = document.getElementById('emptyState');
    const checkNowBtn = document.getElementById('checkNowBtn');

    document.addEventListener('DOMContentLoaded', () => {
      loadConfigToInputs();
      renderSites();
      initEmailJS();
      startAutoCheckLoop();
    });

    settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

    function loadConfigToInputs() {
      document.getElementById('geminiApiKey').value = config.geminiApiKey || '';
      document.getElementById('emailjsServiceId').value = config.emailjsServiceId || '';
      document.getElementById('emailjsTemplateId').value = config.emailjsTemplateId || '';
      document.getElementById('emailjsPublicKey').value = config.emailjsPublicKey || '';
      document.getElementById('targetEmail').value = config.targetEmail || '';
    }

    saveSettingsBtn.addEventListener('click', () => {
      config = {
        geminiApiKey: document.getElementById('geminiApiKey').value.trim(),
        emailjsServiceId: document.getElementById('emailjsServiceId').value.trim(),
        emailjsTemplateId: document.getElementById('emailjsTemplateId').value.trim(),
        emailjsPublicKey: document.getElementById('emailjsPublicKey').value.trim(),
        targetEmail: document.getElementById('targetEmail').value.trim(),
      };
      localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(config));
      initEmailJS();
      settingsModal.classList.add('hidden');
      alert('設定を保存しました');
    });

    function initEmailJS() {
      if (config.emailjsPublicKey) {
        emailjs.init(config.emailjsPublicKey);
      }
    }

    addSiteForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newSite = {
        id: Date.now().toString(),
        name: document.getElementById('siteName').value.trim(),
        url: document.getElementById('siteUrl').value.trim(),
        prompt: document.getElementById('sitePrompt').value.trim(),
        intervalDays: parseInt(document.getElementById('checkInterval').value, 10),
        lastStatus: '未チェック',
        lastChecked: '----/--/-- --:--',
        lastCheckedTimestamp: 0,
        lastContent: ''
      };
      sites.push(newSite);
      saveSites();
      renderSites();
      addSiteForm.reset();
    });

    function saveSites() {
      localStorage.setItem(STORAGE_KEY_SITES, JSON.stringify(sites));
    }

    function deleteSite(id) {
      if (confirm('このサイトを削除しますか？')) {
        sites = sites.filter(s => s.id !== id);
        saveSites();
        renderSites();
      }
    }

    function renderSites() {
      if (sites.length === 0) {
        emptyState.classList.remove('hidden');
        siteList.innerHTML = '';
        siteList.appendChild(emptyState);
        return;
      }

      emptyState.classList.add('hidden');
      siteList.innerHTML = sites.map(site => `
        <div class="border border-slate-200 rounded-lg p-4 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div class="space-y-1 flex-1">
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-slate-800">${escapeHtml(site.name)}</h3>
              <a href="${escapeHtml(site.url)}" target="_blank" class="text-xs text-indigo-600 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square"></i> 開く</a>
            </div>
            <p class="text-xs text-slate-500">指示: ${escapeHtml(site.prompt)}</p>
            <div class="text-xs text-slate-400">
              チェック間隔: <span class="font-medium text-slate-600">${site.intervalDays || 1}日ごと</span> | 
              最終確認: ${site.lastChecked} | 
              状態: <span class="font-medium text-slate-700">${escapeHtml(site.lastStatus)}</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="checkSingleSite('${site.id}')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs rounded font-medium">チェック</button>
            <button onclick="deleteSite('${site.id}')" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-600 text-xs rounded font-medium">削除</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    async function fetchSiteContent(url) {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error('ページ取得失敗');
      const data = await res.json();
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(data.contents, 'text/html');
      return doc.body.innerText.replace(/\s+/g, ' ').substring(0, 3000);
    }

    async function analyzeWithGemini(promptText, currentText, previousText) {
      if (!config.geminiApiKey) throw new Error('Gemini API Keyが設定されていません');

      const systemPrompt = `あなたはWebサイトの更新監視アシスタントです。
指示に従い、前回のテキストと今回のテキストを比較して変化があるか確認してください。

【指示】: ${promptText}

【前回のテキスト】:
${previousText || '（初回の比較データなし）'}

【今回のテキスト】:
${currentText}

回答は以下のフォーマットのJSON形式のみで返してください。
{
  "hasUpdate": true または false,
  "summary": "更新内容の簡潔な要約（更新がない場合は「更新なし」）"
}`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.geminiApiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: systemPrompt }] }]
        })
      });

      if (!res.ok) throw new Error('Gemini APIエラー');
      const data = await res.json();
      const rawText = data.candidates[0].content.parts[0].text;
      const cleanJson = rawText.replace(/```json|```/g, '').trim();
      return JSON.parse(cleanJson);
    }

    async function sendNotification(siteName, url, summary) {
      if (!config.emailjsServiceId || !config.targetEmail) return;

      await emailjs.send(config.emailjsServiceId, config.emailjsTemplateId, {
        to_email: config.targetEmail,
        site_name: siteName,
        site_url: url,
        update_summary: summary
      });
    }

    async function checkSingleSite(id) {
      const site = sites.find(s => s.id === id);
      if (!site) return;

      site.lastStatus = 'チェック中...';
      renderSites();

      try {
        const textContent = await fetchSiteContent(site.url);
        const result = await analyzeWithGemini(site.prompt, textContent, site.lastContent);

        const now = new Date();
        site.lastChecked = now.toLocaleString('ja-JP');
        site.lastCheckedTimestamp = now.getTime();
        
        if (result.hasUpdate && site.lastContent !== '') {
          site.lastStatus = `✨ 更新あり: ${result.summary}`;
          await sendNotification(site.name, site.url, result.summary);
        } else {
          site.lastStatus = site.lastContent === '' ? '初回チェック完了（基準設定）' : '更新なし';
        }

        site.lastContent = textContent;
      } catch (err) {
        site.lastStatus = `エラー: ${err.message}`;
      }

      saveSites();
      renderSites();
    }

    checkNowBtn.addEventListener('click', async () => {
      for (const site of sites) {
        await checkSingleSite(site.id);
      }
    });

    // 設定された日数（間隔）が経過しているサイトのみ自動チェック
    function startAutoCheckLoop() {
      setInterval(() => {
        const now = Date.now();
        sites.forEach(site => {
          const intervalMs = (site.intervalDays || 1) * 24 * 60 * 60 * 1000;
          if (now - (site.lastCheckedTimestamp || 0) >= intervalMs) {
            checkSingleSite(site.id);
          }
        });
      }, 600000); // 10分ごとにスケジュール確認
    }
  </script>
</body>
</html>

  <!-- メインJS処理 -->
  <script>
    const STORAGE_KEY_SITES = 'web_watcher_sites';
    const STORAGE_KEY_CONFIG = 'web_watcher_config';

    let sites = JSON.parse(localStorage.getItem(STORAGE_KEY_SITES) || '[]');
    let config = JSON.parse(localStorage.getItem(STORAGE_KEY_CONFIG) || '{}');

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const addSiteForm = document.getElementById('addSiteForm');
    const siteList = document.getElementById('siteList');
    const emptyState = document.getElementById('emptyState');
    const checkNowBtn = document.getElementById('checkNowBtn');

    document.addEventListener('DOMContentLoaded', () => {
      loadConfigToInputs();
      renderSites();
      initEmailJS();
      startAutoCheckLoop();
    });

    settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

    function loadConfigToInputs() {
      document.getElementById('geminiApiKey').value = config.geminiApiKey || '';
      document.getElementById('emailjsServiceId').value = config.emailjsServiceId || '';
      document.getElementById('emailjsTemplateId').value = config.emailjsTemplateId || '';
      document.getElementById('emailjsPublicKey').value = config.emailjsPublicKey || '';
      document.getElementById('targetEmail').value = config.targetEmail || '';
    }

    saveSettingsBtn.addEventListener('click', () => {
      config = {
        geminiApiKey: document.getElementById('geminiApiKey').value.trim(),
        emailjsServiceId: document.getElementById('emailjsServiceId').value.trim(),
        emailjsTemplateId: document.getElementById('emailjsTemplateId').value.trim(),
        emailjsPublicKey: document.getElementById('emailjsPublicKey').value.trim(),
        targetEmail: document.getElementById('targetEmail').value.trim(),
      };
      localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(config));
      initEmailJS();
      settingsModal.classList.add('hidden');
      alert('設定を保存しました');
    });

    function initEmailJS() {
      if (config.emailjsPublicKey) {
        emailjs.init(config.emailjsPublicKey);
      }
    }

    addSiteForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newSite = {
        id: Date.now().toString(),
        name: document.getElementById('siteName').value.trim(),
        url: document.getElementById('siteUrl').value.trim(),
        prompt: document.getElementById('sitePrompt').value.trim(),
        intervalDays: parseInt(document.getElementById('checkInterval').value, 10),
        lastStatus: '未チェック',
        lastChecked: '----/--/-- --:--',
        lastCheckedTimestamp: 0,
        lastContent: ''
      };
      sites.push(newSite);
      saveSites();
      renderSites();
      addSiteForm.reset();
    });

    function saveSites() {
      localStorage.setItem(STORAGE_KEY_SITES, JSON.stringify(sites));
    }

    function deleteSite(id) {
      if (confirm('このサイトを削除しますか？')) {
        sites = sites.filter(s => s.id !== id);
        saveSites();
        renderSites();
      }
    }

    function renderSites() {
      if (sites.length === 0) {
        emptyState.classList.remove('hidden');
        siteList.innerHTML = '';
        siteList.appendChild(emptyState);
        return;
      }

      emptyState.classList.add('hidden');
      siteList.innerHTML = sites.map(site => `
        <div class="border border-slate-200 rounded-lg p-4 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div class="space-y-1 flex-1">
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-slate-800">${escapeHtml(site.name)}</h3>
              <a href="${escapeHtml(site.url)}" target="_blank" class="text-xs text-indigo-600 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square"></i> 開く</a>
            </div>
            <p class="text-xs text-slate-500">指示: ${escapeHtml(site.prompt)}</p>
            <div class="text-xs text-slate-400">
              チェック間隔: <span class="font-medium text-slate-600">${site.intervalDays || 1}日ごと</span> | 
              最終確認: ${site.lastChecked} | 
              状態: <span class="font-medium text-slate-700">${escapeHtml(site.lastStatus)}</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="checkSingleSite('${site.id}')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs rounded font-medium">チェック</button>
            <button onclick="deleteSite('${site.id}')" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-600 text-xs rounded font-medium">削除</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    async function fetchSiteContent(url) {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error('ページ取得失敗');
      const data = await res.json();
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(data.contents, 'text/html');
      return doc.body.innerText.replace(/\s+/g, ' ').substring(0, 3000);
    }

    async function analyzeWithGemini(promptText, currentText, previousText) {
      if (!config.geminiApiKey) throw new Error('Gemini API Keyが設定されていません');

      const systemPrompt = `あなたはWebサイトの更新監視アシスタントです。
指示に従い、前回のテキストと今回のテキストを比較して変化があるか確認してください。

【指示】: ${promptText}

【前回のテキスト】:
${previousText || '（初回の比較データなし）'}

【今回のテキスト】:
${currentText}

回答は以下のフォーマットのJSON形式のみで返してください。
{
  "hasUpdate": true または false,
  "summary": "更新内容の簡潔な要約（更新がない場合は「更新なし」）"
}`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.geminiApiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: systemPrompt }] }]
        })
      });

      if (!res.ok) throw new Error('Gemini APIエラー');
      const data = await res.json();
      const rawText = data.candidates[0].content.parts[0].text;
      const cleanJson = rawText.replace(/```json|```/g, '').trim();
      return JSON.parse(cleanJson);
    }

    async function sendNotification(siteName, url, summary) {
      if (!config.emailjsServiceId || !config.targetEmail) return;

      await emailjs.send(config.emailjsServiceId, config.emailjsTemplateId, {
        to_email: config.targetEmail,
        site_name: siteName,
        site_url: url,
        update_summary: summary
      });
    }

    async function checkSingleSite(id) {
      const site = sites.find(s => s.id === id);
      if (!site) return;

      site.lastStatus = 'チェック中...';
      renderSites();

      try {
        const textContent = await fetchSiteContent(site.url);
        const result = await analyzeWithGemini(site.prompt, textContent, site.lastContent);

        const now = new Date();
        site.lastChecked = now.toLocaleString('ja-JP');
        site.lastCheckedTimestamp = now.getTime();
        
        if (result.hasUpdate && site.lastContent !== '') {
          site.lastStatus = `✨ 更新あり: ${result.summary}`;
          await sendNotification(site.name, site.url, result.summary);
        } else {
          site.lastStatus = site.lastContent === '' ? '初回チェック完了（基準設定）' : '更新なし';
        }

        site.lastContent = textContent;
      } catch (err) {
        site.lastStatus = `エラー: ${err.message}`;
      }

      saveSites();
      renderSites();
    }

    checkNowBtn.addEventListener('click', async () => {
      for (const site of sites) {
        await checkSingleSite(site.id);
      }
    });

    // 設定された日数（間隔）が経過しているサイトのみ自動チェック
    function startAutoCheckLoop() {
      setInterval(() => {
        const now = Date.now();
        sites.forEach(site => {
          const intervalMs = (site.intervalDays || 1) * 24 * 60 * 60 * 1000;
          if (now - (site.lastCheckedTimestamp || 0) >= intervalMs) {
            checkSingleSite(site.id);
          }
        });
      }, 600000); // 10分ごとにスケジュール確認
    }
  </script>
</body>
</html>
